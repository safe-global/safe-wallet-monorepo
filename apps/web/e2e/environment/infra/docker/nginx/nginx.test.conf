worker_processes 1;

events {
  worker_connections 2000;
  accept_mutex off;
  use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    ## Transaction Service
    upstream txs_app_server {
      server unix:/nginx-txs/gunicorn.socket fail_timeout=0;
      keepalive 32;
    }

    ## Config service
    upstream cfg_app_server {
      ip_hash;
      server unix:/nginx-cfg/gunicorn.socket fail_timeout=0;
      keepalive 32;
    }

    ## Client gateway
    upstream cgw_app_server {
      ip_hash;
      server cgw-web:3000 fail_timeout=0;
      keepalive 32;
    }

    upstream events_app_server {
      ip_hash;
      server events-web:3000 fail_timeout=0;
      keepalive 32;
    }

    server {
        access_log off;
        listen 8000 deferred;
        charset utf-8;
        keepalive_timeout 75s;

        gzip             on;
        gzip_min_length 1000;
        gzip_comp_level  2;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript
                   text/javascript text/xml application/xml application/rss+xml application/atom+xml
                   application/rdf+xml;
        gzip_disable "MSIE [1-6]\.";

        location /decoder/ {
            proxy_pass http://decoder-web:8888/;
        }

        location /billing/ {
            proxy_pass http://billing-api:8093/;
        }

        ## Transaction service mounting point
        location /txs/static {
            alias /nginx-txs/staticfiles;
            expires 365d;
        }

        location /txs/ {
            include cors.conf;

            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    Host                $host;
            proxy_redirect off;
            proxy_pass http://txs_app_server/;

            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            add_header              Front-End-Https   on;
        }

        ## Optional forked chains; resolved per request so nginx starts without their profiles
        location ~ ^/txs-(mainnet|polygon)/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $txs_chain_upstream txs-web-$1:8888;

            include cors.conf;

            rewrite ^/txs-[a-z]+/(.*)$ /$1 break;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    Host                $host;
            proxy_redirect off;
            proxy_pass http://$txs_chain_upstream;
        }

        ## Config service mounting point
        location /cfg/static {
            alias /nginx-cfg/staticfiles;
            expires 365d;
        }

        location /cfg/media {
            alias /nginx-cfg/media;
        }

        location /cfg/ {
            include cors.conf;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
            add_header              Front-End-Https   on;
            proxy_redirect off;
            proxy_pass http://cfg_app_server/;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
      }

      ## Client gateway mounting point
      location /cgw/ {
            include cors.conf;

            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    Host                $host;
            proxy_redirect off;
            proxy_pass http://cgw_app_server/;

            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            add_header              Front-End-Https   on;
        }

      ## Events service mounting point
      location /events/ {
            include cors.conf;

            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    Host                $host;
            proxy_redirect off;
            proxy_pass http://events_app_server/events/;

            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            add_header              Front-End-Https   on;
        }

      location / {
          return 404;
      }

    }
}
