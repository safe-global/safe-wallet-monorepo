compressionLevel: mixed

enableConstraintsChecks: true

enableGlobalCache: true

enableScripts: false

nodeLinker: node-modules

# The devcontainer (.devcontainer/) bind-mounts node_modules from the host,
# so installs on macOS must also fetch Linux native bindings (and vice versa)
# or modules like @rspack/binding fail to load inside the container.
supportedArchitectures:
  os:
    - current
    - linux
    - darwin
  cpu:
    - current
    - arm64
    - x64
  libc:
    - current
    - glibc

# eslint-config-next requires next at runtime but doesn't declare it as
# a peer dependency. Without this, Yarn hoists eslint-config-next to root
# where it can't resolve next (which lives in apps/web/node_modules/).
packageExtensions:
  eslint-config-next@*:
    peerDependencies:
      next: '*'

# Known peer mismatches that we accept. packageExtensions cannot replace an existing peer range,
# so these exact warnings are discarded instead. A pattern matches a substring of the message.
logFilters:
  # Only a summary of the YN0002/YN0060 lines, plus peer bugs inside third-party packages.
  - code: YN0086
    level: discard
  # Run on React 19, peer range stops at 18. In web, this also covers react-hook-form 7.41.1.
  - pattern: 'satisfy what @safe-global/safe-apps-react-sdk and other dependencies request'
    level: discard
  - pattern: 'satisfy what @cowprotocol/widget-react and other dependencies request'
    level: discard

# Set cool down period for npm packages to 7 days
# This prevents the installation of npm packages if
# they are updated within the last 7 days
npmMinimalAgeGate: 10080
# Allow in-house @safe-global packages to bypass the age gate
npmPreapprovedPackages:
  - '@safe-global/*'
