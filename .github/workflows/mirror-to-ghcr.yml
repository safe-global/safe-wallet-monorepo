name: Mirror Docker Hub tags to GHCR

# One-off migration helper. Delete once the Docker Hub migration is signed off.
#
# Copies tags already published to Docker Hub into this repo's GHCR package
# without rebuilding, so each manifest digest is preserved exactly. No Safe
# deployment pins this image; it is published for self-hosters, and preserving
# digests keeps their `@sha256` pins valid across the registry move.
#
# Pushing with the repository's GITHUB_TOKEN is what links the new package to
# this repo so it inherits repository access. Reads Docker Hub with the shared
# credential, so run this before that credential is revoked.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Space-separated tags to mirror'
        type: string
        default: >-
          staging dev latest 1.51.2 v1.99.1 v1.99.0 v1.97.0 v1.96.2
          v1.96.0 v1.94.0 v1.93.1 v1.93.0 v1.92.2 v1.92.1 v1.92.0 v1.91.1
          v1.91.0 v1.90.0 v1.89.3 v1.89.1 v1.89.0 v1.88.0 v1.87.4 v1.87.3
          v1.87.2 v1.87.1 v1.87.0 v1.86.4 v1.86.3 v1.86.2 v1.86.1 v1.86.0
          v1.85.0 v1.84.0 v1.83.3 v1.83.2 v1.83.1 v1.83.0 v1.82.0 v1.76.0
          v1.75.1 v1.74.0 v1.73.0 v1.72.3 v1.72.2 v1.72.1 v1.72.0 v1.71.1
          v1.71.0 v1.70.0 v1.69.2 v1.69.1 v1.69.0 v1.68.0 v1.67.0 v1.66.1
          v1.66.0 v1.65.0 v1.64.0 v1.63.0 v1.62.1 v1.62.0 v1.61.0 v1.60.1
          v1.60.0 v1.59.0 v1.58.0 v1.57.0 v1.56.2 v1.56.1 v1.56.0 v1.55.1
          v1.55.0 v1.54.0 v1.53.1 v1.53.0 v1.52.2 v1.52.1 v1.52.0 v1.51.5
          v1.51.4 v1.51.3 v1.51.2 v1.51.1 v1.51.0 v1.50.3 v1.50.2 v1.50.1
          v1.49.3 v1.49.2 v1.49.1 v1.48.2 v1.48.1 v1.48.0 v1.47.5 v1.47.4
          v1.47.3 v1.47.2 v1.47.1 v1.47.0 v1.46.0 v1.45.3 v1.45.2 v1.45.1
          v1.45.0 v1.44.3 v1.44.2 v1.44.1 v1.44.0 v1.43.1 v1.43.0 v1.41.5
          v1.41.3 v1.41.2 v1.41.1 v1.40.1 v1.40.0 v1.39.2 v1.39.1 v1.39.0
          v1.38.1 v1.38.0 v1.37.2 v1.37.1 v1.36.5 v1.36.4 v1.36.3 v1.36.2
          v1.36.1 v1.36.0 v1.35.0 v1.34.1 v1.34.0 v1.33.0 v1.32.1 v1.32.0
          v1.31.0 v1.30.0 v1.29.1 v1.29.0 v1.28.0 v1.27.0 v1.26.2 v1.26.1
          v1.25.3 v1.25.2 v1.25.1 v1.25.0 v1.24.0 v1.23.0 v1.22.2 v1.22.1
          v1.22.0 v1.21.0 v1.20.0 v1.19.1 v1.19.0 v1.18.0 v1.17.1 v1.17.0
          v1.16.0 v1.15.2 v1.15.1 v1.15.0 v1.14.0 v1.13.0 v1.12.0 v1.11.0
          v1.10.0 v1.9.1
      dry_run:
        description: 'Resolve and report digests without writing to GHCR'
        type: boolean
        default: true

permissions: {}

concurrency: ${{ github.workflow }}

env:
  SRC: docker.io/safeglobal/safe-wallet-web
  DST: ghcr.io/safe-global/safe-wallet-web
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

jobs:
  mirror:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Install crane (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tgz" | sha256sum -c -
          tar -xzf crane.tgz crane
          sudo install -m 0755 crane /usr/local/bin/crane
          crane version

      - name: Log in to Docker Hub (source, read-only)
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKER_PASSWORD" | crane auth login docker.io -u "$DOCKER_USER" --password-stdin

      - name: Log in to GHCR (destination)
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Mirror tags
        env:
          INPUT_TAGS: ${{ inputs.tags }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          read -r -a TAGS <<< "$INPUT_TAGS"

          # GHCR throttles sustained blob writes with a 403, not a 429, which
          # crane treats as fatal. Serialising blob uploads stays under the
          # threshold; retrying the whole copy recovers if it is crossed anyway,
          # since blobs already uploaded are skipped.
          copy_with_retry() {
            local src="$1" dst="$2" attempt=1 max=4 backoff
            while :; do
              if crane copy -j 1 "$src" "$dst"; then
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                return 1
              fi
              backoff=$((attempt * 20))
              echo "  attempt $attempt failed - retrying in ${backoff}s"
              sleep "$backoff"
              attempt=$((attempt + 1))
            done
          }

          {
            echo "### \`$SRC\` → \`$DST\`"
            echo
            echo "| tag | digest | result |"
            echo "| --- | ------ | ------ |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0

          for tag in "${TAGS[@]}"; do
            [ -n "$tag" ] || continue

            if ! src_digest=$(crane digest "$SRC:$tag" 2>/dev/null); then
              echo "FAIL  $tag - cannot read source manifest"
              echo "| \`$tag\` | | **failed** - unreadable source |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "would copy  $tag  $src_digest"
              echo "| \`$tag\` | \`$src_digest\` | dry run |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if ! copy_with_retry "$SRC:$tag" "$DST:$tag"; then
              echo "FAIL  $tag - copy did not complete after retries"
              echo "| \`$tag\` | \`$src_digest\` | **failed** - copy error |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
              continue
            fi

            dst_digest=$(crane digest "$DST:$tag")

            if [ "$src_digest" != "$dst_digest" ]; then
              echo "DIGEST MISMATCH on $tag"
              echo "  src $src_digest"
              echo "  dst $dst_digest"
              echo "| \`$tag\` | \`$src_digest\` | **DIGEST MISMATCH** |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
              continue
            fi

            echo "ok    $tag  $src_digest"
            echo "| \`$tag\` | \`$src_digest\` | copied, digest preserved |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed tag(s) failed to mirror"
            exit 1
          fi
