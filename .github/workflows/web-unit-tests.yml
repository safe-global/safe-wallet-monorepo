name: Web Unit tests
on:
  pull_request:
    paths:
      - apps/web/**
      - packages/**
      - yarn.lock
      - package.json
      - .yarnrc.yml
      - .yarn/patches/**

  push:
    branches:
      - main
      - dev
    paths:
      - apps/web/**
      - packages/**
      - yarn.lock
      - package.json
      - .yarnrc.yml
      - .yarn/patches/**
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/yarn

      - name: Run tests
        run: yarn test:ci
        working-directory: apps/web
        env:
          NEXT_PUBLIC_IS_OFFICIAL_HOST: true

      - name: Upload test report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: head-report
          path: apps/web/report.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload coverage to Datadog
        if: success() && github.event_name == 'push'
        uses: $/.github/actions/upload-coverage
        with:
          api-key: ${{ secrets.DATADOG_API_KEY }}
          site: datadoghq.eu
          coverage-path: apps/web/coverage
          base-path: apps/web
          flag: workspace:web

      - name: Notify Slack on failure
        if: failure() && github.event_name == 'push'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_DEV_ALERT }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Web unit tests failed on ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ Web Unit Tests Failed*\n• Branch: `${{ github.ref_name }}`\n• Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n• Author: ${{ github.actor }}\n• <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }

  base-coverage:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: $/.github/actions/yarn

      - name: Run tests on base branch
        # Only the base coverage is needed, so failing tests on the base branch must not fail this PR
        continue-on-error: true
        run: yarn test:ci
        working-directory: apps/web
        env:
          NEXT_PUBLIC_IS_OFFICIAL_HOST: true

      - name: Upload base test report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: base-report
          path: apps/web/report.json
          retention-days: 1
          if-no-files-found: ignore

  coverage-report:
    needs: [test, base-coverage]
    if: always() && github.event_name == 'pull_request' && needs.test.result != 'cancelled'
    permissions:
      contents: read
      checks: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: head-report
          path: apps/web

      - uses: actions/download-artifact@v8.0.2
        with:
          name: base-report
          path: apps/web/base

      - name: Annotations and coverage report
        uses: ArtiomTr/jest-coverage-report-action@v2.3.1
        with:
          skip-step: all
          coverage-file: report.json
          base-coverage-file: base/report.json
          annotations: failed-tests
          working-directory: apps/web
          github-token: ${{ secrets.GITHUB_TOKEN }}
