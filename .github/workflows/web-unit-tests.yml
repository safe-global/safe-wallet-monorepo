name: Web Unit tests
on:
  pull_request:
    paths:
      - apps/web/**
      - packages/**
      - yarn.lock
      - package.json
      - .yarnrc.yml
      - .yarn/patches/**

  push:
    branches:
      - main
      - dev
    paths:
      - apps/web/**
      - packages/**
      - yarn.lock
      - package.json
      - .yarnrc.yml
      - .yarn/patches/**
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/yarn

      - name: Run tests
        # One shard only covers part of the code, so the coverage threshold is checked on the merged coverage instead
        run: yarn test:ci --shard=${{ matrix.shard }}/4 --coverageThreshold='{}'
        working-directory: apps/web
        env:
          NEXT_PUBLIC_IS_OFFICIAL_HOST: true

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard }}
          path: apps/web/coverage/coverage-final.json
          retention-days: 1
          if-no-files-found: error

  coverage:
    needs: test
    if: ${{ !cancelled() }}
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/yarn

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: apps/web/shards

      - name: Merge coverage and check threshold
        working-directory: apps/web
        # nyc merge only reads files at the top level of the folder, and download-artifact puts each shard in its own subfolder
        run: |
          for dir in shards/*/; do mv "${dir}coverage-final.json" "${dir%/}.json"; done
          test "$(ls shards/*.json | wc -l)" -eq 4
          yarn nyc merge shards .nyc_output/coverage.json
          yarn nyc report --temp-dir .nyc_output --reporter=lcov --reporter=text-summary --report-dir coverage
          yarn nyc check-coverage --temp-dir .nyc_output --branches 56 --functions 62 --lines 78 --statements 76

      - name: Upload coverage to Datadog
        if: success() && github.event_name == 'push' && needs.test.result == 'success'
        uses: ./.github/actions/upload-coverage
        with:
          api-key: ${{ secrets.DATADOG_API_KEY }}
          site: datadoghq.eu
          coverage-path: apps/web/coverage
          base-path: apps/web
          flag: workspace:web

      - name: Notify Slack on failure
        if: github.event_name == 'push' && (failure() || needs.test.result != 'success')
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_DEV_ALERT }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Web unit tests failed on ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ Web Unit Tests Failed*\n• Branch: `${{ github.ref_name }}`\n• Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n• Author: ${{ github.actor }}\n• <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
