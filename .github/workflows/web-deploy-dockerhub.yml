name: Web Deploy to Dockerhub

on:
  pull_request:
    branches:
      - docker
    paths:
      - apps/web/**
      - packages/**

  push:
    branches:
      - main
      - dev
    paths:
      - apps/web/**
      - packages/**

  release:
    types: [released]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. web-v1.85.0)'
        required: true
        type: string

permissions: {}

jobs:
  dockerhub-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev' ||
      (github.event_name == 'release' && github.event.action == 'released') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Dockerhub login
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: GHCR login
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy Main
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          tags: |
            safeglobal/safe-wallet-web:staging
            ghcr.io/safe-global/safe-wallet-web:staging
          platforms: |
            linux/amd64
            linux/arm64
      - name: Deploy Develop
        if: github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          tags: |
            safeglobal/safe-wallet-web:dev
            ghcr.io/safe-global/safe-wallet-web:dev
          platforms: |
            linux/amd64
            linux/arm64
      - name: Resolve Docker tag
        if: (github.event_name == 'release' && github.event.action == 'released') || github.event_name == 'workflow_dispatch'
        id: docker_tag
        run: |
          RAW_TAG="${{ github.event.release.tag_name || inputs.tag }}"
          # Strip app prefix if present (e.g. web-v1.85.0 -> v1.85.0)
          echo "tag=${RAW_TAG#web-}" >> $GITHUB_OUTPUT
      - name: Deploy Tag
        if: (github.event_name == 'release' && github.event.action == 'released') || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          tags: |
            safeglobal/safe-wallet-web:${{ steps.docker_tag.outputs.tag }}
            safeglobal/safe-wallet-web:latest
            ghcr.io/safe-global/safe-wallet-web:${{ steps.docker_tag.outputs.tag }}
            ghcr.io/safe-global/safe-wallet-web:latest
          platforms: |
            linux/amd64
            linux/arm64
