name: Package @safe-global/utils unit tests
on:
  # No paths filter: the required result job must report on every pull request.
  pull_request:
  push:
    branches:
      - main
    paths:
      - packages/**
      - yarn.lock
      - package.json
      - .yarnrc.yml
      - .yarn/patches/**
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - id: changes
        uses: $/.github/actions/pr-changes
        with:
          paths: |
            packages/utils/**
            packages/store/**
            yarn.lock
            package.json
            .yarnrc.yml
            .yarn/patches/**
            .github/workflows/package-utils-unit-tests.yml
            .github/actions/yarn/**
            .github/actions/corepack/**
            .github/actions/pr-changes/**
            .github/actions/required-result/**

  eslint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    permissions:
      checks: write
      pull-requests: read
      statuses: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: $/.github/actions/yarn

      # Run tests with coverage
      - name: Run Jest tests with coverage
        run: |
          yarn workspace @safe-global/utils test:coverage \
            --coverageReporters=text \
            --coverageReporters=json-summary \
            --coverageReporters=lcov \
            | tee ./coverage.txt && exit ${PIPESTATUS[0]}

      - name: Jest Coverage Comment
        uses: MishaKav/jest-coverage-comment@v1.0.37
        with:
          title: Package @safe-global/utils coverage
          coverage-summary-path: ./coverage/coverage-summary.json
          coverage-title: Coverage
          coverage-path: ./coverage.txt

      - name: Upload coverage to Datadog
        if: success() && github.event_name == 'push'
        uses: $/.github/actions/upload-coverage
        with:
          api-key: ${{ secrets.DATADOG_API_KEY }}
          site: datadoghq.eu
          coverage-path: packages/utils/coverage
          base-path: packages/utils
          flag: workspace:utils

  result:
    # The one check that branch protection requires for this workflow.
    name: Utils unit tests result
    if: always()
    needs: [changes, eslint]
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/required-result
        with:
          needs: ${{ toJSON(needs) }}
          relevant: ${{ needs.changes.outputs.relevant }}
