name: Web TanStack Checks

on:
  # No paths filter: the required result job must report on every pull request.
  pull_request:
  push:
    branches:
      - main
      - dev
    paths:
      - apps/web-tanstack/**
      - apps/web/**
      - packages/**
      - yarn.lock
      - package.json
      - .yarnrc.yml
      - .yarn/patches/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - id: changes
        uses: $/.github/actions/pr-changes
        with:
          paths: |
            apps/web-tanstack/**
            apps/web/**
            packages/**
            yarn.lock
            package.json
            .yarnrc.yml
            .yarn/patches/**
            .github/workflows/web-tanstack-checks.yml
            .github/actions/yarn/**
            .github/actions/corepack/**
            .github/actions/pr-changes/**
            .github/actions/required-result/**

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/yarn
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
      - run: yarn workspace @safe-global/web-tanstack build
      # Assert every emitted JS/CSS chunk matches its recorded sha384 integrity
      # (re-hash after build; fails on tamper or gaps).
      - run: yarn workspace @safe-global/web-tanstack assert:sri
      # The build must ship our generated worker, not the stale publicDir copies.
      - name: Assert service worker output
        working-directory: apps/web-tanstack
        run: |
          test -f dist/sw.js || { echo "::error::dist/sw.js missing"; exit 1; }
          grep -q "addToCacheList\|precache" dist/sw.js || { echo "::error::sw.js has no precache manifest"; exit 1; }
          test ! -e dist/firebase-messaging-sw.js || { echo "::error::stale firebase-messaging-sw.js shipped"; exit 1; }
          ! ls dist/workbox-*.js >/dev/null 2>&1 || { echo "::error::stale workbox-*.js shipped"; exit 1; }
          test -f dist/offline.html || { echo "::error::offline.html missing from precache"; exit 1; }

  verify-changed:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: $/.github/actions/yarn
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
      - run: node scripts/verify.mjs --changed --workspace=web-tanstack

  result:
    # The one check that branch protection requires for this workflow.
    name: Web TanStack checks result
    if: always()
    needs: [changes, build, verify-changed]
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/required-result
        with:
          needs: ${{ toJSON(needs) }}
          relevant: ${{ needs.changes.outputs.relevant }}
