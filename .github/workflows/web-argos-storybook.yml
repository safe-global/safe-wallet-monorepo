name: Web Argos Storybook

# Visual regression for the web Storybook: builds it statically, screenshots every
# story in light + dark via scripts/storybook/render-sweep.ts, and uploads them to
# Argos as sheets (one image per title, one per fullscreen story). The sweep runs in 4
# parallel shards; the visual job joins their sheets and does the rest.
#
# Uploads to the Argos project that ARGOS_TOKEN_E2E names, under the build
# name `storybook`.
#
# Pushes to dev record the sha256 of every sheet and upload a new baseline only when a sheet
# changed since the previous dev commit; unchanged merges keep the last baseline, which is
# still correct because their images are identical.
#
# Pull requests upload only the sheets that differ from their merge base on dev, as an Argos
# subset build, and a skipped build when none differ. A PR that removes a sheet uploads all
# sheets as a full build, because a subset build ignores removals. Thus the Argos status
# `argos/safe-wallet-monorepo/storybook` reports on every PR and can be a required check
# (docs/ci-required-checks.md).

on:
  pull_request:
  push:
    branches: [dev]
  # Weekly baseline on dev. Release checks are started by hand.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      reference_branch:
        description: 'Argos baseline branch (default: dev)'
        required: false
        type: string
      reference_commit:
        description: 'Argos baseline commit SHA (full 40-char hex)'
        required: false
        type: string
      filter:
        description: 'Only sweep stories whose id/title contains this substring'
        required: false
        type: string

concurrency:
  # One group per dev commit, so each merge records its manifest instead of cancelling the last one
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: changes
        uses: $/.github/actions/pr-changes
        with:
          paths: |
            apps/web/**
            packages/**
            yarn.lock
            package.json
            .yarnrc.yml
            .yarn/patches/**
            config/**
            yarn.config.cjs
            scripts/storybook/**
            .github/workflows/web-argos-storybook.yml
            .github/actions/yarn/**
            .github/actions/corepack/**
            .github/actions/pr-changes/**

  # A PR that cannot change a story still needs a green Argos status to merge
  skip:
    needs: changes
    if: needs.changes.outputs.relevant != 'true'
    runs-on: ubuntu-26.04-arm
    name: Storybook visual tests (Argos) skipped
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Report a skipped Argos build
        run: npx --yes @argos-ci/cli skip --build-name storybook
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN_E2E }}

  # Each shard sweeps whole titles, so its sheets are complete; the visual job joins them.
  sweep:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    name: Storybook sweep (${{ matrix.shard }}/4)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      # The PR's own head, not GitHub's merge commit, so the sheets compare with its merge base
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: $/.github/actions/yarn
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Build Storybook
        run: yarn workspace @safe-global/web build-storybook --output-dir storybook-static

      # Port 4000 is whitelisted in OFFICIAL_HOSTS (src/config/constants.ts); other ports
      # blank the host-gated pages (Imprint/Licenses) and produce false diffs.
      - name: Serve Storybook
        working-directory: apps/web
        run: |
          npx --yes http-server storybook-static -p 4000 -s &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/index.json -o /dev/null && exit 0
            sleep 2
          done
          echo "Storybook static server did not come up" >&2
          exit 1

      - name: Screenshot this shard's stories (light + dark)
        # Broken stories (SB_ERROR) exit 1 — keep what rendered; the visual job reports them.
        continue-on-error: true
        working-directory: apps/web
        run: |
          yarn storybook:sweep \
            --base=http://localhost:4000 \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            --shots=argos-screenshots \
            --manifest=sheets-manifest.json \
            --json=sweep-findings.json \
            --concurrency=6 \
            ${{ inputs.filter && format('--filter={0}', inputs.filter) || '' }}

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: storybook-sweep-${{ matrix.shard }}
          path: |
            apps/web/argos-screenshots/
            apps/web/sheets-manifest.json
            apps/web/sweep-findings.json
          if-no-files-found: error
          retention-days: 3

  visual:
    needs: sweep
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    name: Storybook visual tests (Argos)
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: $/.github/actions/yarn
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Find the PR's merge base
        id: merge-base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "sha=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

      # A PR compares with its merge base only; a guessed baseline would hide or invent diffs
      - name: Restore the baseline manifest
        id: base-manifest
        uses: actions/cache/restore@v5.0.5
        with:
          path: apps/web/sheets-manifest.json
          key: storybook-sheets-manifest-${{ steps.merge-base.outputs.sha || github.event.before || github.sha }}
          restore-keys: ${{ github.event_name != 'pull_request' && 'storybook-sheets-manifest-' || '' }}

      - name: Keep it as the baseline
        if: steps.base-manifest.outputs.cache-matched-key != ''
        working-directory: apps/web
        run: mv sheets-manifest.json base-manifest.json

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: storybook-sweep-*
          path: apps/web/shards

      - name: Join the shards
        working-directory: apps/web
        run: |
          mkdir argos-screenshots
          cp shards/*/argos-screenshots/*.png argos-screenshots/
          jq -s add shards/*/sheets-manifest.json > sheets-manifest.json
          jq -s '{ total: (map(.total) | add), bad: (map(.bad) | add), findings: (map(.findings) | add) }' \
            shards/*/sweep-findings.json > sweep-findings.json
          sheets=$(find argos-screenshots -name '*.png' | wc -l)
          hashed=$(jq length sheets-manifest.json)
          # A title is never split, so two shards writing the same sheet means a bug in the split
          if [ "$sheets" -ne "$hashed" ]; then
            echo "::error::$sheets sheet files but $hashed manifest entries — two shards wrote the same sheet"
            exit 1
          fi

      - name: Report changed sheets
        id: diff
        working-directory: apps/web
        env:
          BASE_KEY: ${{ steps.base-manifest.outputs.cache-matched-key }}
          EXACT_BASE: ${{ steps.base-manifest.outputs.cache-hit }}
        run: |
          report=$(npx tsx ../../scripts/storybook/diff-manifest.ts base-manifest.json sheets-manifest.json upload-list.txt)
          {
            echo "$report"
            echo
            echo "Baseline: \`${BASE_KEY:-none}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Without the baseline commit's own manifest the diff is a guess, so count it as changed
          if [ "$EXACT_BASE" = true ] && grep -q '^sheets changed: 0 of' <<< "$report"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "to-upload=$(grep -c . upload-list.txt || true)" >> "$GITHUB_OUTPUT"
          # A subset build ignores removed sheets, so a PR that removes one needs a full build
          if grep -q '^### Removed' <<< "$report"; then
            echo "removed=true" >> "$GITHUB_OUTPUT"
          else
            echo "removed=false" >> "$GITHUB_OUTPUT"
          fi

      # On dev, a merge that changed no sheet keeps the last baseline
      - name: Upload to Argos
        if: >-
          (github.event_name != 'pull_request' && (github.event_name != 'push' || steps.diff.outputs.changed == 'true'))
          || (github.event_name == 'pull_request' && steps.diff.outputs.removed == 'true')
        working-directory: apps/web
        run: npx --yes @argos-ci/cli upload argos-screenshots --build-name storybook
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN_E2E }}
          ARGOS_REFERENCE_BRANCH: ${{ inputs.reference_branch || 'dev' }}
          ARGOS_REFERENCE_COMMIT: ${{ inputs.reference_commit || '' }}

      # Argos compares the subset with the dev baseline at the merge base and ignores the sheets left out
      - name: Upload the changed sheets to Argos
        if: github.event_name == 'pull_request' && steps.diff.outputs.removed != 'true' && steps.diff.outputs.to-upload != '0'
        working-directory: apps/web
        run: |
          mkdir argos-upload
          while read -r sheet; do cp "argos-screenshots/$sheet" argos-upload/; done < upload-list.txt
          npx --yes @argos-ci/cli upload argos-upload --build-name storybook --subset
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN_E2E }}
          ARGOS_REFERENCE_BRANCH: dev

      - name: Report a skipped Argos build
        if: github.event_name == 'pull_request' && steps.diff.outputs.removed != 'true' && steps.diff.outputs.to-upload == '0'
        working-directory: apps/web
        run: npx --yes @argos-ci/cli skip --build-name storybook
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN_E2E }}

      # After the upload: a failed upload skips this, so the next dev merge still sees the change
      - name: Save the manifest for the next dev commit
        if: github.event_name == 'push'
        uses: actions/cache/save@v5.0.5
        with:
          path: apps/web/sheets-manifest.json
          key: storybook-sheets-manifest-${{ github.sha }}

      # A story broken on dev is already merged; warn on push runs instead of failing every later merge
      - name: Report broken stories
        working-directory: apps/web
        env:
          LEVEL: ${{ github.event_name == 'push' && 'warning' || 'error' }}
        run: |
          broken=$(jq -r '.findings[] | select(any(.issues[]; startswith("SB_ERROR"))) | "\(.id) \(.mode) \(.issues[0])"' sweep-findings.json)
          [ -z "$broken" ] && exit 0
          echo "$broken"
          echo "::$LEVEL::render sweep flagged broken stories (SB_ERROR) — see the lines above"
          [ "$LEVEL" = warning ] || exit 1

  # Argos posts no status when the sweep or the upload fails, which leaves a PR waiting with no red check
  result:
    name: Storybook visual tests result
    permissions: {}
    if: always()
    needs: [changes, sweep, visual]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: $/.github/actions/required-result
        with:
          needs: ${{ toJSON(needs) }}
          relevant: ${{ needs.changes.outputs.relevant }}
