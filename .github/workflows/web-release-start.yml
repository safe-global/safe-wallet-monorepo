name: 🚀 Start Web Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.74.0) - leave empty to auto-increment'
        required: false
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        default: 'regular'
        options:
          - regular
          - hotfix
      base_branch:
        description: 'Base branch (auto-selected based on release type, override if needed)'
        required: false
        type: string

permissions: {}

jobs:
  start-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true
          git_committer_name: 'GH Signer Bot'
          git_committer_email: 'gh-signer-bot@safe.global'

      - name: Determine base branch
        id: base
        env:
          INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ -n "$INPUT_BASE_BRANCH" ]; then
            BASE="$INPUT_BASE_BRANCH"
          elif [ "$INPUT_RELEASE_TYPE" = "hotfix" ]; then
            BASE="main"
          else
            BASE="dev"
          fi
          echo "branch=$BASE" >> $GITHUB_OUTPUT
          echo "📍 Base branch: $BASE"

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # Validate provided version format
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Invalid version format. Expected: X.Y.Z where X, Y, Z are numbers (e.g., 1.74.0)"
              echo "Received: '$INPUT_VERSION'"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
            echo "✅ Using provided version: $VERSION"
          else
            # Auto-increment version based on release type
            CURRENT_VERSION=$(git tag -l 'web-v*' --sort=-v:refname | head -n 1 | sed 's/^web-v//')

            # Validate extraction succeeded
            if [ -z "$CURRENT_VERSION" ]; then
              echo "❌ Error: Could not find a previous web-v* release tag"
              exit 1
            fi

            echo "📍 Current version: $CURRENT_VERSION"

            # Parse version components
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            # Validate parsed components
            if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
              echo "❌ Error: Could not parse version components from: $CURRENT_VERSION"
              exit 1
            fi

            if [ "$INPUT_RELEASE_TYPE" = "hotfix" ]; then
              # Hotfix: increment patch version (last number)
              PATCH=$((PATCH + 1))
              echo "🔧 Hotfix: incrementing patch version"
            else
              # Regular release: increment minor version (middle number), reset patch
              MINOR=$((MINOR + 1))
              PATCH=0
              echo "🚀 Regular release: incrementing minor version"
            fi

            VERSION="$MAJOR.$MINOR.$PATCH"
            echo "✅ Auto-generated version: $VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version already exists
        run: |
          if git rev-parse "web-v${{ steps.version.outputs.version }}" >/dev/null 2>&1 || git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "❌ Version ${{ steps.version.outputs.version }} already exists (checked both web-v and legacy v prefix)!"
            exit 1
          fi
          echo "✅ Version is new"

      - name: Check for concurrent release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: release/${{ steps.version.outputs.version }}
        run: |
          OPEN_RELEASES=$(gh pr list --base main --state open --json headRefName \
            --jq '.[] | select(.headRefName | startswith("release/")) | .headRefName' \
            | grep -vx "$RELEASE_BRANCH" || true)
          if [ -n "$OPEN_RELEASES" ]; then
            echo "⚠️  Warning: Another release is already in progress:"
            echo "$OPEN_RELEASES"
            echo ""
            echo "Finish or close that release PR before starting a new one."
            exit 1
          fi
          echo "✅ Safe to create/update release branch"

      - name: Create/update release branch
        env:
          RELEASE_BRANCH: release/${{ steps.version.outputs.version }}
        run: |
          git checkout -B "$RELEASE_BRANCH" origin/${{ steps.base.outputs.branch }}
          git push origin "$RELEASE_BRANCH"
          echo "✅ Release branch $RELEASE_BRANCH created from ${{ steps.base.outputs.branch }}"

      - name: Generate changelog
        id: changelog
        run: |
          cd apps/web

          # Use enhanced changelog generator if available, fallback to legacy
          if [ -f ./scripts/release/generate-changelog.sh ]; then
            CHANGELOG=$(bash ./scripts/release/generate-changelog.sh main ${{ steps.base.outputs.branch }})
          else
            CHANGELOG=$(bash ./scripts/release-notes.sh main ${{ steps.base.outputs.branch }})
          fi

          # Save to file for PR body
          echo "$CHANGELOG" > /tmp/changelog.md

          echo "✅ Changelog generated"

      - name: Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          cd apps/web

          # Read changelog
          CHANGELOG=$(cat /tmp/changelog.md)

          # Create PR body
          PR_BODY=$(cat <<EOF
          ## 🚀 Release web-v${{ steps.version.outputs.version }}

          $CHANGELOG

          ---

          ## 📋 QA Checklist
          - [ ] Regression testing completed
          - [ ] New features tested
          - [ ] Bug fixes verified
          - [ ] Cross-browser testing done
          - [ ] Performance checked

          ## 📝 Next Steps
          1. ✅ PR created - **YOU ARE HERE**
          2. ⏳ QA team reviews and tests
          3. ⏳ **Merge PR to main WITHOUT SQUASHING** (after QA approval)
          4. ⏳ Auto: Tag, release, build, upload to S3 & back-merge PR

          ---

          ## ⚠️ IMPORTANT: How to Merge

          **Do NOT use GitHub's merge button!**

          Merge commits are disabled in this repo. Use the command line:

          \`\`\`bash
          git push origin release/${{ steps.version.outputs.version }}:main
          \`\`\`

          ---

          **Release Type:** ${INPUT_RELEASE_TYPE}
          **Base Branch:** ${{ steps.base.outputs.branch }}

          🤖 *This PR was created automatically by the [Start Web Release workflow](https://github.com/${{ github.repository }}/actions/workflows/web-release-start.yml)*
          EOF
          )

          # Create the PR
          PR_URL=$(gh pr create \
            --base main \
            --head release/${{ steps.version.outputs.version }} \
            --title "Release web-v${{ steps.version.outputs.version }}" \
            --body "$PR_BODY" \
            --label "release" \
            | tail -n 1)

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "✅ Pull Request created: $PR_URL"

      # Create/sync the release in the Linear "Wallet" pipeline and move it to
      # Code Freeze. Guarded so a Linear outage never blocks cutting a release.
      - name: Sync release to Linear
        id: linear_sync
        continue-on-error: true
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384 # v0.17.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_WEB }}
          command: sync
          version: ${{ steps.version.outputs.version }}
          include_paths: apps/web/**,packages/**
          links: ${{ steps.create_pr.outputs.pr_url }}

      - name: Move Linear release to Code Freeze
        continue-on-error: true
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384 # v0.17.2
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_WEB }}
          command: update
          version: ${{ steps.version.outputs.version }}
          stage: Code Freeze

      - name: Notify on Slack
        if: vars.SLACK_WEBHOOK_URL
        continue-on-error: true
        env:
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          LINEAR_URL: ${{ steps.linear_sync.outputs['release-url'] }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_TYPE="$INPUT_RELEASE_TYPE"
          BASE_BRANCH="${{ steps.base.outputs.branch }}"
          PR_URL="${{ steps.create_pr.outputs.pr_url }}"
          LINEAR_LINK=""
          if [ -n "$LINEAR_URL" ]; then
            LINEAR_LINK="<$LINEAR_URL|View release in Linear>"
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg release_type "$RELEASE_TYPE" \
            --arg base "$BASE_BRANCH" \
            --arg pr_url "$PR_URL" \
            --arg linear "$LINEAR_LINK" \
            '{
              text: ("🚀 *Release web-v" + $version + " Started*"),
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("*Release web-v" + $version + " has been initiated* ✅\n\n*Type:* " + $release_type + "\n*Base:* " + $base + "\n*PR:* " + $pr_url + (if $linear != "" then "\n*Linear:* " + $linear else "" end) + "\n\n_QA team: Please review and test_ 🧪")
                  }
                }
              ]
            }' | curl -X POST "${{ vars.SLACK_WEBHOOK_URL }}" \
              -H 'Content-Type: application/json' \
              -d @-

      - name: Summary
        env:
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          echo "### 🎉 Release Started Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** web-v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** $INPUT_RELEASE_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "**Base Branch:** ${{ steps.base.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** ${{ steps.create_pr.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ **Release branch created and PR opened**" >> $GITHUB_STEP_SUMMARY
          echo "2. ⏳ QA team should test the changes" >> $GITHUB_STEP_SUMMARY
          echo "3. ⏳ When QA approves, merge the PR to main" >> $GITHUB_STEP_SUMMARY
          echo "4. ⏳ Auto: Tag, release, build, upload to S3 & back-merge PR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Pull Request](${{ steps.create_pr.outputs.pr_url }})" >> $GITHUB_STEP_SUMMARY
