name: 'Playwright browsers'

description: "Install the Chromium build of apps/web's Playwright version, with its system dependencies"

inputs:
  build:
    description: "'shell' for the headless shell, 'full' for the full Chromium build"
    required: true

runs:
  using: 'composite'
  steps:
    - name: Resolve the Playwright version
      id: playwright
      shell: bash
      working-directory: apps/web
      env:
        BUILD: ${{ inputs.build }}
      run: |
        case "$BUILD" in
          shell) echo "flag=--only-shell" >> "$GITHUB_OUTPUT" ;;
          full) echo "flag=--no-shell" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::Unknown build '$BUILD'; use 'shell' or 'full'" && exit 1 ;;
        esac
        echo "version=$(yarn exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    # Each Playwright version pins one browser revision, so the key changes only on a Playwright upgrade.
    - name: Restore Playwright browsers
      id: browsers
      uses: actions/cache/restore@v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-chromium-${{ inputs.build }}

    # Runs on a cache hit too: the system dependencies are not cached, and Playwright skips the download.
    - name: Install Playwright browsers
      shell: bash
      working-directory: apps/web
      run: yarn exec playwright install --with-deps ${{ steps.playwright.outputs.flag }} chromium

    # Only trusted events save, as in the Yarn action: a pull request cache serves no other branch.
    - name: Save Playwright browsers
      if: ${{ contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) && steps.browsers.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browsers.outputs.cache-primary-key }}
