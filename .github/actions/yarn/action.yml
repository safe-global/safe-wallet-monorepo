name: 'Yarn'

description: 'Set up Node.js and install dependencies'

inputs:
  after-install:
    description: 'Run web after-install step to generate contract types'
    required: false
    default: 'true'
  turbo-token:
    description: 'Turborepo remote cache token (Vercel PAT)'
    required: false
    default: ''
  turbo-team:
    description: 'Turborepo remote cache team slug'
    required: false
    default: ''
  cache:
    description: "Restore and save the Yarn caches; set to 'false' in jobs that hold deploy or publish credentials"
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: $/.github/actions/corepack

    - uses: actions/setup-node@v6.4.0
      id: node
      with:
        node-version: '24.22.1'

    - name: Export Turbo remote cache env
      if: inputs.turbo-token != ''
      shell: bash
      run: |
        echo "TURBO_TOKEN=${{ inputs.turbo-token }}" >> "$GITHUB_ENV"
        echo "TURBO_TEAM=${{ inputs.turbo-team }}" >> "$GITHUB_ENV"
        echo "TURBO_REMOTE_ONLY=false" >> "$GITHUB_ENV"

    # Archives are stored by checksum, so an older cache is safe to restore and saves most downloads.
    - name: Restore Yarn download cache
      id: downloads
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v5.0.5
      with:
        path: ~/.yarn/berry/cache
        key: ${{ runner.os }}-${{ runner.arch }}-yarn-downloads-${{ hashFiles('yarn.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-yarn-downloads-

    # Restored only on an exact match: an older tree could keep packages that the lockfile dropped.
    - name: Restore node_modules
      id: modules
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v5.0.5
      with:
        path: |
          **/node_modules
          ~/.cache/Cypress
          .yarn/install-state.gz
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-modules-${{
          hashFiles('yarn.lock', '**/package.json', '.yarnrc.yml', '.yarn/patches/**') }}

    # Runs on a cache hit too: Yarn then only checks the tree against the lockfile.
    - name: Yarn install
      shell: bash
      run: yarn install --immutable

    - name: Yarn after-install to generate contracts types
      if: inputs.after-install == 'true'
      shell: bash
      run: yarn workspace @safe-global/web after-install

    # Only trusted events save: pull request caches serve no other branch and evict the shared ones,
    # and pull_request_target, workflow_run or issue_comment runs could poison the dev scope that deploys restore.
    - name: Save Yarn download cache
      if: ${{ inputs.cache == 'true' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) && steps.downloads.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5.0.5
      with:
        path: ~/.yarn/berry/cache
        key: ${{ steps.downloads.outputs.cache-primary-key }}

    - name: Save node_modules
      if: ${{ inputs.cache == 'true' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) && steps.modules.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5.0.5
      with:
        path: |
          **/node_modules
          ~/.cache/Cypress
          .yarn/install-state.gz
        key: ${{ steps.modules.outputs.cache-primary-key }}
