name: 'Cache Next.js build'
description: 'Restore or save the Next.js build cache'
inputs:
  mode:
    description: 'restore-nc | save-nc'
    required: true
  key:
    description: 'The cache key to use to safe. Attention! Make sure to use the correct computed cache key depending on the mode'
    required: false

outputs:
  cache-hit-nc:
    value: ${{ steps.restore-nc.outputs.cache-hit }}
    description: 'Whether the cache was hit or not'
  computed-cache-key-nc:
    value: ${{ steps.restore-nc.outputs.cache-primary-key }}
    description: 'The computed cache key for nextjs/cypress'

runs:
  using: 'composite'
  steps:
    - name: Restore Next.js
      if: ${{ inputs.mode == 'restore-nc' }}
      id: restore-nc
      uses: actions/cache/restore@v5.0.5
      with:
        path: |
          ${{ github.workspace }}/apps/web/.next/cache
        key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('yarn.lock', 'apps/web/package.json') }}-${{ hashFiles('apps/web/src/**/*', 'apps/web/public/**/*', 'apps/web/*.{js,jsx,cjs,ts,mjs,tsx,json}') }}
        # Only pull requests take an older cache: webpack trusts cached output, so deploy builds need an exact match.
        restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-{1}-nextjs-{2}-', runner.os, runner.arch, hashFiles('yarn.lock', 'apps/web/package.json')) || '' }}

    - name: Set composite outputs nc
      if: ${{ inputs.mode == 'restore-nc' }}
      shell: bash
      run: |
        echo "cache-hit-nc=${{ steps.restore-nc.outputs.cache-hit }}" >> $GITHUB_OUTPUT
        echo "computed-cache-key-nc=${{ steps.restore-nc.outputs.cache-primary-key }}" >> $GITHUB_OUTPUT

    - name: Save Next.js
      if: ${{ inputs.mode == 'save-nc' }}
      uses: actions/cache/save@v5.0.5
      with:
        path: |
          ${{ github.workspace }}/apps/web/.next/cache
        key: ${{inputs.key}}
