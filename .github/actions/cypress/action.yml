name: 'Cypress'

description: 'Run Cypress'

inputs:
  spec:
    description: 'Glob pattern(s) for the specs to run, separated by newlines or commas. Split across containers before running.'
    required: true

  group:
    description: 'The name of the group (e.g. "smoke")'
    required: true

  project_id:
    description: 'Cypress cloud project id'
    required: false

  tag:
    description: 'Cypress cloud tag key'
    required: false

  record:
    description: 'Record results to Cypress Cloud'
    required: false
    default: 'true'

  container-index:
    description: 'Zero-based index of this container in the matrix (strategy.job-index)'
    required: false
    default: '0'

  container-count:
    description: 'Number of containers in the matrix (strategy.job-total)'
    required: false
    default: '1'

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/yarn

    - name: Install Chrome
      uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
      with:
        chrome-version: '134'
      id: setup-chrome

    # Secrets (CYPRESS_*, BEAMER_DATA_E2E, NEXT_PUBLIC_*) come from the calling
    # workflow's `env:` block on the step that uses this action.
    - uses: ./.github/actions/build
      env:
        NODE_ENV: cypress
        # `next build` overrides NODE_ENV to 'production' in client bundles, so
        # APP_ENV-based IS_TEST_E2E doesn't survive. Forward an explicit
        # NEXT_PUBLIC_ flag that does survive the build.
        NEXT_PUBLIC_IS_TEST_E2E: 'true'

    # Cypress Cloud's --parallel rejects a machine whose OS version differs from
    # the first machine in the group, and GitHub-hosted runners in one matrix land
    # on different image versions while a new runner image rolls out. Each
    # container therefore runs a fixed slice of the sorted spec list and records
    # as its own group instead.
    - name: Select specs for this container
      id: specs
      shell: bash
      working-directory: apps/web
      env:
        SPEC: ${{ inputs.spec }}
        GROUP: ${{ inputs.group }}
        CONTAINER_INDEX: ${{ inputs.container-index }}
        CONTAINER_COUNT: ${{ inputs.container-count }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        all=()
        while IFS= read -r pattern; do
          pattern="${pattern#"${pattern%%[![:space:]]*}"}"
          pattern="${pattern%"${pattern##*[![:space:]]}"}"
          [ -z "$pattern" ] && continue
          for file in $pattern; do all+=("$file"); done
        done < <(printf '%s\n' "$SPEC" | tr ',' '\n')
        if [ "${#all[@]}" -eq 0 ]; then
          echo "::error::No spec file matches: $SPEC"
          exit 1
        fi
        mapfile -t all < <(printf '%s\n' "${all[@]}" | LC_ALL=C sort -u)
        shard=()
        for i in "${!all[@]}"; do
          if (( i % CONTAINER_COUNT == CONTAINER_INDEX )); then shard+=("${all[$i]}"); fi
        done
        echo "Container $((CONTAINER_INDEX + 1))/$CONTAINER_COUNT runs ${#shard[@]} of ${#all[@]} specs"
        [ "${#shard[@]}" -gt 0 ] && printf '  %s\n' "${shard[@]}"
        echo "spec=$(IFS=,; echo "${shard[*]}")" >> "$GITHUB_OUTPUT"
        if [ "$CONTAINER_COUNT" -gt 1 ]; then GROUP="$GROUP $((CONTAINER_INDEX + 1))/$CONTAINER_COUNT"; fi
        echo "group=$GROUP" >> "$GITHUB_OUTPUT"

    - uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
      if: steps.specs.outputs.spec != ''
      with:
        spec: ${{ steps.specs.outputs.spec }}
        group: ${{ inputs.record == 'true' && steps.specs.outputs.group || '' }}
        browser: ${{ steps.setup-chrome.outputs.chrome-path }}
        record: ${{ inputs.record == 'true' }}
        tag: ${{ inputs.record == 'true' && inputs.tag || '' }}
        config: baseUrl=http://localhost:8080
        install: false
        start: yarn workspace @safe-global/web serve
        wait-on: 'http://localhost:8080'
        wait-on-timeout: 120
        working-directory: apps/web
      env:
        NODE_ENV: cypress
        GITHUB_TOKEN: ${{ github.token }}
        CYPRESS_PROJECT_ID: ${{ inputs.project_id }}
